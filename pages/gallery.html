<!--
    =====================================================================
    HOW TO ADD / CHANGE GALLERY PICTURES
    =====================================================================
    1. Put the screenshot in   images/gallery/
       (any .jpg / .png / .webp, any size - full-res is fine)

    2. Add ONE line for it to the list below, inside the [ ... ]:

         { "src": "images/gallery/the-wall-drops.png", "by": "Jackson", "season": 2, "caption": "The wall coming down" },

       - "src"     the file you added (must match the filename exactly)
       - "by"      who took it - shows on the picture and in the
                   "Taken by" filter
       - "season"  1, 2 or 3 (or 0 if it's not from a season)
       - "caption" one short line, shown when you open the picture

       Every line ends with a comma EXCEPT the last one.
       Order = the order they appear on the page.

    3. Push to GitHub. The deploy automatically makes small, fast
       thumbnails of every picture in images/gallery/ - you never have
       to resize anything yourself.

    To REMOVE a picture: delete its line (and the file if you like).
    To CHANGE one: swap the file, or edit its line.
    =====================================================================
-->
