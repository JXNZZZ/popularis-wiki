===========================
map implimentation log
===========================

1. Installed and configured BlueMap CLI
   - Downloaded bluemap-cli.jar and ensured Java was installed.
   - Verified the CLI could run and access configuration files.

2. Prepared the Minecraft world for rendering
   - Placed the world folder where BlueMap could read region data.
   - Ensured BlueMap had access to block, biome, and heightmap files.

3. Configured a custom render-mask (2048x2048)
   - Edited the map config to limit rendering to a 2048x2048 area.
   - Used:
       min-x: -1024
       max-x: 1024
       min-z: -1024
       max-z: 1024
   - This optimized performance and reduced render time.

4. Rendered the map
   - Ran: java -jar bluemap-cli.jar -r
   - Generated the full /web/ viewer folder including:
       index.html
       assets/
       maps/
       data/

5. Added custom POIs (Points of Interest)
   - Created a marker-set in the config.
   - Added coordinates, labels, and categories for volcanic locations.

6. Added custom flame icons (depreciated)
   - Created /assets/icons/ directory.
   - Added flame.png and set:
       icon: "assets/icons/flame.png"
       icon-size: 24

7. Hosted BlueMap using the built-in server
   - Used: java -jar bluemap-cli.jar -w
   - This served the map correctly on a local port (e.g., 8100).
   - Required because BlueMap needs proper worker + JSON routing.

8. Embedded BlueMap into the website
   - Added an iframe to locations.html:
       <iframe src="http://localhost:8100/" ... ></iframe>
   - This displayed the interactive 3D map inside the site.

9. Updated SPA router to avoid blocking BlueMap
   - Added a rule so the router does NOT intercept BlueMap paths:
       if (path.startsWith("/public/bluemap")) return;
   - Prevented the SPA from rewriting BlueMap URLs.

10. Made the setup portable
   - Organized BlueMap into:
       bluemap-cli.jar
       configs/
       web/
   - Only need the world folder again if re-rendering.
