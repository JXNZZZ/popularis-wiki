<h1>Advancements</h1>

<p class="season-intro">
    These unlock as you read the wiki, the same way advancements pop up in-game.
    Your progress is saved in this browser only.
</p>

<div class="ach-progress">
    <div class="ach-bar"><div id="ach-bar-fill"></div></div>
    <span id="ach-count"></span>
</div>

<div id="achievements-grid" class="ach-grid"></div>

<p class="ach-hint">
    Locked ones still show what you need to do. A couple of them aren't on this list at all &mdash;
    you'll have to stumble into those.
</p>

<button type="button" class="btn btn-secondary" id="ach-reset">Reset my progress</button>
